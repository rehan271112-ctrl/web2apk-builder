name: Build APK

on:
  push:
    branches:
      - build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Extract uploaded project zip
        run: |
          mkdir -p extracted_project
          unzip -o build_upload/source.zip -d extracted_project
          if [ -f extracted_project/pubspec.yaml ]; then
            cp -rf extracted_project/. .
          else
            SUBDIR=$(find extracted_project -maxdepth 2 -name pubspec.yaml -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cp -rf "$SUBDIR"/. .
            fi
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
