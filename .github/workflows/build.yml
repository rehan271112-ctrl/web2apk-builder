name: Build APK

on:
  push:
    branches:
      - build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install system dependencies (optimized)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick jq unzip curl
          sudo rm -rf /var/lib/apt/lists/*

      - name: Read build config
        id: config
        run: |
          if [ -f build-config.json ]; then
            echo "type=$(jq -r .type build-config.json)" >> $GITHUB_ENV
            echo "url=$(jq -r .url build-config.json)" >> $GITHUB_ENV
            echo "app_name=$(jq -r .app_name build-config.json)" >> $GITHUB_ENV
            echo "build_type=$(jq -r .build_type build-config.json)" >> $GITHUB_ENV
            cat build-config.json
          else
            echo "type=unknown" >> $GITHUB_ENV
          fi

      - name: Generate keystore for signing
        run: |
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      # ==================== WEB2APK ====================
      - name: Web2APK - Create root gradle files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project
          cat > project/build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.7.3' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF

          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF

          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Web2APK - Create app/build.gradle
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app
          cat > project/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.web2apk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.webkit:webkit:1.4.0'
          }
          EOF

      - name: Web2APK - Create Java source files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/java/com/web2apk/app

          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java <<'EOF'
          package com.web2apk.app;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.Toolbar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
              private static final String WEBSITE_URL = "URL_PLACEHOLDER";
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefreshLayout = findViewById(R.id.swipeRefreshLayout);
                  Toolbar toolbar = findViewById(R.id.toolbar);
                  setSupportActionBar(toolbar);
                  if (getSupportActionBar() != null) getSupportActionBar().setTitle(getString(R.string.app_name));
                  setupWebView();
                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl(WEBSITE_URL);
              }
              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                          swipeRefreshLayout.setRefreshing(false);
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("tel:") || url.startsWith("mailto:") || url.startsWith("intent:") || url.startsWith("whatsapp:")) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView view, int progress) {
                          progressBar.setProgress(progress);
                          progressBar.setVisibility(progress >= 100 ? View.GONE : View.VISIBLE);
                      }
                  });
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, contentDisposition);
                      ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(request);
                  });
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) { webView.goBack(); return; }
                  super.onBackPressed();
              }
              @Override protected void onResume() { if (webView != null) webView.onResume(); }
              @Override protected void onPause() { if (webView != null) webView.onPause(); super.onPause(); }
              @Override protected void onDestroy() { if (webView != null) webView.destroy(); super.onDestroy(); }
          }
          EOF

          cat > project/app/src/main/java/com/web2apk/app/SplashActivity.java <<'EOF'
          package com.web2apk.app;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.appcompat.app.AppCompatActivity;
          public class SplashActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> {
                      startActivity(new Intent(SplashActivity.this, MainActivity.class));
                      finish();
                  }, 1800);
              }
          }
          EOF

      - name: Web2APK - Create resources
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/res/{layout,values}

          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:allowBackup="true" android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true" android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round" android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity android:name=".SplashActivity" android:exported="true" android:theme="@style/SplashTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="false"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode" />
              </application>
          </manifest>
          EOF

          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
              <androidx.appcompat.widget.Toolbar android:id="@+id/toolbar"
                  android:layout_width="match_parent" android:layout_height="56dp"
                  android:background="#000000" app:titleTextColor="#FFFFFF"/>
              <ProgressBar android:id="@+id/progressBar" style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent" android:layout_height="4dp" android:max="100"/>
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout android:id="@+id/swipeRefreshLayout"
                  android:layout_width="match_parent" android:layout_height="match_parent">
                  <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent"/>
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          </LinearLayout>
          EOF

          cat > project/app/src/main/res/layout/activity_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000000">
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_centerInParent="true" android:gravity="center" android:orientation="vertical">
                  <ImageView android:id="@+id/splashLogo" android:layout_width="120dp" android:layout_height="120dp"
                      android:src="@mipmap/ic_launcher" />
                  <TextView android:id="@+id/splashAppName" android:layout_width="wrap_content"
                      android:layout_height="wrap_content" android:text="@string/app_name"
                      android:textSize="26sp" android:textStyle="bold" android:textColor="#FFFFFF"
                      android:layout_marginTop="20dp" />
                  <ProgressBar android:id="@+id/splashProgress" android:layout_width="40dp"
                      android:layout_height="40dp" android:layout_marginTop="30dp" />
              </LinearLayout>
          </RelativeLayout>
          EOF

          cat > project/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#2196F3</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
          </resources>
          EOF

          cat > project/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AppName</string>
              <string name="loading">Loading...</string>
          </resources>
          EOF

          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="SplashTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: Web2APK - Apply config, icons & keystore
        if: env.type == 'web2apk'
        run: |
          sed -i "s|URL_PLACEHOLDER|${{ env.url }}|g" project/app/src/main/java/com/web2apk/app/MainActivity.java
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ env.app_name }}</string>|g" project/app/src/main/res/values/strings.xml

          if [ ! -f build-assets/icon.png ] || ! file build-assets/icon.png | grep -q PNG; then
            echo "⚠️ Icon tidak valid, membuat default..."
            convert -size 512x512 xc:blue build-assets/icon.png
          fi

          for size_dir in "72 hdpi" "48 mdpi" "96 xhdpi" "144 xxhdpi" "192 xxxhdpi"; do
            set -- $size_dir
            mkdir -p "project/app/src/main/res/mipmap-$2"
            convert build-assets/icon.png -resize "${1}x${1}" "project/app/src/main/res/mipmap-$2/ic_launcher.png"
            cp "project/app/src/main/res/mipmap-$2/ic_launcher.png" "project/app/src/main/res/mipmap-$2/ic_launcher_round.png"
          done

          rm -f project/app/debug.keystore
          keytool -genkey -v -keystore project/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Web2APK - Build (cached)
        if: env.type == 'web2apk'
        run: |
          cd project
          gradle assembleRelease --build-cache --parallel

      - name: Web2APK - Sign APK
        if: env.type == 'web2apk'
        run: |
          APK_PATH=$(find project/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Menandatangani Web2APK APK: $APK_PATH"
            BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
              --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK_PATH"
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify "$APK_PATH"
          else
            echo "❌ APK Web2APK tidak ditemukan"
          fi

      # ==================== FLUTTER ====================
      - name: Prepare Flutter project
        if: env.type == 'flutter'
        run: |
          rm -rf flutter-project
          mkdir -p flutter-project
          unzip -q flutter-project.zip -d flutter-project
          FIRST_DIR=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ROOT_FILES=$(find flutter-project -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ROOT_FILES" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            TMP_DIR=$(mktemp -d)
            cp -R "$FIRST_DIR"/. "$TMP_DIR"/
            rm -rf flutter-project && mkdir -p flutter-project
            cp -R "$TMP_DIR"/. flutter-project/
          fi
          [ ! -f flutter-project/pubspec.yaml ] && echo "pubspec.yaml tidak ditemukan" && exit 1
          echo "✅ Flutter project ready"

      - name: Detect Flutter version from pubspec
        if: env.type == 'flutter'
        id: flutter_detect
        shell: bash
        run: |
          set -e
          PUBSPEC="flutter-project/pubspec.yaml"
          SDK_LINE=$(grep -A2 '^environment:' "$PUBSPEC" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'"'"']//g' || true)
          FLUTTER_VERSION="3.27.0"
          DART_VERSION=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n1)

          if [ -n "$DART_VERSION" ]; then
            case "$DART_VERSION" in
              3.1[0-5]*) FLUTTER_VERSION="3.35.2" ;;
              3.[89]*)   FLUTTER_VERSION="3.35.2" ;;
              3.7*)      FLUTTER_VERSION="3.29.0" ;;
              3.6*)      FLUTTER_VERSION="3.27.0" ;;
              3.5*)      FLUTTER_VERSION="3.24.0" ;;
              3.4*)      FLUTTER_VERSION="3.22.0" ;;
              3.3*)      FLUTTER_VERSION="3.19.0" ;;
              3.2*)      FLUTTER_VERSION="3.16.0" ;;
              3.1*)      FLUTTER_VERSION="3.13.0" ;;
              3.0*)      FLUTTER_VERSION="3.10.0" ;;
            esac
          fi

          # Plugin override checks
          for pattern in \
            'webview_flutter:[[:space:]]*(\^|>=)?4\.(1[5-9]|[2-9])' \
            'webview_flutter:[[:space:]]*(\^|>=)?5\.' \
            'geolocator:[[:space:]]*(\^|>=)?1[45]\.' \
            'google_maps_flutter:[[:space:]]*(\^|>=)?2\.(1[0-9]|[2-9])' \
            'google_maps_flutter:[[:space:]]*(\^|>=)?3\.' \
            'firebase_core:[[:space:]]*(\^|>=)?3\.' \
            'firebase_[a-z_]+:[[:space:]]*(\^|>=)?3\.' \
            'flutter_local_notifications:[[:space:]]*(\^|>=)?17\.' \
            'workmanager:[[:space:]]*(\^|>=)?0\.(6|[7-9])' \
            'image_picker:[[:space:]]*(\^|>=)?1\.(2[0-9]|[3-9])' \
            'file_picker:[[:space:]]*(\^|>=)?8\.' \
            'permission_handler:[[:space:]]*(\^|>=)?12\.'; do
            grep -Eq "$pattern" "$PUBSPEC" && FLUTTER_VERSION="3.35.2" && break
          done

          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Using Flutter $FLUTTER_VERSION (Dart $DART_VERSION)"

      - name: Setup Flutter SDK (cached)
        if: env.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter APK with auto-fix
        if: env.type == 'flutter'
        shell: bash
        run: |
          set -e
          cd flutter-project
          flutter --version

          PUB_LOG="../pubget.log"
          BUILD_MODE="${{ env.build_type }}"
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          try_pub_get() { flutter pub get 2>&1 | tee "$PUB_LOG"; return ${PIPESTATUS[0]}; }

          auto_fix_pubspec() {
            local FIXED=false
            echo "=== Auto-fixing pubspec.yaml ==="

            if grep -q "requires SDK version\|requires Dart SDK version" "$PUB_LOG"; then
              sed -i -E 's/sdk:[[:space:]]*['"'"'"]?[\^>=]*3\.[0-9]+(\.[0-9]+)?['"'"'"]?/sdk: ">=3.6.0 <4.0.0"/g' pubspec.yaml || true
              FIXED=true
            fi

            declare -A FIXES=(
              ["webview_flutter"]="webview_flutter: ^4.13.0"
              ["geolocator"]="geolocator: ^13.0.4"
              ["google_maps_flutter"]="google_maps_flutter: ^2.9.0"
              ["permission_handler"]="permission_handler: ^11.3.1"
              ["firebase_core"]="firebase_core: ^2.32.0"
              ["file_picker"]="file_picker: ^6.2.1"
              ["image_picker"]="image_picker: ^1.1.2"
              ["flutter_local_notifications"]="flutter_local_notifications: ^17.2.4"
              ["workmanager"]="workmanager: ^0.5.2"
            )

            for pkg in "${!FIXES[@]}"; do
              if grep -q "$pkg" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
                echo "Fix: Downgrading $pkg"
                sed -i -E "s/${pkg}:[[:space:]]*['\"']?[^'\"]+['\"']?/${FIXES[$pkg]}/g" pubspec.yaml || true
                FIXED=true
              fi
            done

            if grep -q "overrides" "$PUB_LOG"; then
              sed -i '/^dependency_overrides:/,/^[^ ]/d' pubspec.yaml || true
              FIXED=true
            fi

            if [ "$FIXED" = true ]; then
              echo "✅ Pubspec telah di-fix"
              rm -f pubspec.lock
            fi
          }

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "=== Attempt $RETRY_COUNT/$MAX_RETRIES ==="

            if try_pub_get; then
              FLAG=$([ "$BUILD_MODE" = "release" ] && echo "--release" || echo "--debug")
              if flutter build apk $FLAG; then
                SUCCESS=true && echo "✅ Build successful!" && break
              else
                echo "❌ Build failed, attempting fix..."
                auto_fix_pubspec && rm -rf build .dart_tool
              fi
            else
              echo "❌ pub get failed, attempting fix..."
              auto_fix_pubspec && rm -f pubspec.lock
            fi
          done

          [ "$SUCCESS" = false ] && echo "❌ Failed after $MAX_RETRIES attempts" && cat "$PUB_LOG" && exit 1

      - name: Sign Flutter APK (release only)
        if: env.type == 'flutter' && env.build_type == 'release'
        run: |
          APK_PATH=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
              --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK_PATH"
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify "$APK_PATH"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            project/app/build/outputs/apk/release/*.apk
            flutter-project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
