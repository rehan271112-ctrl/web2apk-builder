name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      # ==========================================================
      # CHECKOUT PROJECT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # JAVA 17
      # Cocok untuk Android Gradle modern
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================================
      # SETUP FLUTTER
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================================
      # SHOW ENVIRONMENT
      # ==========================================================
      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      # ==========================================================
      # CACHE PUB
      # ==========================================================
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ==========================================================
      # GET DEPENDENCIES
      # ==========================================================
      - name: Get dependencies
        run: flutter pub get

      # ==========================================================
      # CHECK DEPENDENCIES
      # Tidak menghentikan build hanya karena info outdated
      # ==========================================================
      - name: Check outdated packages
        run: flutter pub outdated || true

      # ==========================================================
      # CHECK ASSETS
      # Membantu mendeteksi asset yang hilang
      # ==========================================================
      - name: Check project files
        run: |
          echo "Checking important files..."

          test -f "pubspec.yaml"
          test -d "android"
          test -d "lib"

          echo "Project structure looks valid."

      # ==========================================================
      # BUILD APK RELEASE
      # ==========================================================
      - name: Build APK Release
        run: |
          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --verbose

      # ==========================================================
      # SHOW BUILD OUTPUT
      # ==========================================================
      - name: Show APK files
        if: always()
        run: |
          echo "APK output:"
          find build -type f -name "*.apk" 2>/dev/null || true

      # ==========================================================
      # UPLOAD RELEASE APK
      # ==========================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: xxo25-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # UPLOAD DEBUG LOG / OUTPUT
      # ==========================================================
      - name: Upload build information
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-information
          path: |
            build/
            android/.gradle/
          if-no-files-found: ignore
          retention-days: 7