name: Flutter Builder Bot

on:
  push:
    branches:
      - build
    paths:
      - 'build-config.json'
      - 'flutter-project.zip'
      - 'build-assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. CHECKOUT & READ CONFIG
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: build

      - name: Read build config
        id: config
        run: |
          if [ ! -f build-config.json ]; then
            echo "❌ build-config.json not found!"
            exit 1
          fi
          BUILD_TYPE=$(jq -r '.type' build-config.json)
          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "📋 Build type: ${BUILD_TYPE}"
          cat build-config.json

      # ============================================================
      # 2A. FLUTTER BUILD
      # ============================================================
      - name: Setup Java JDK 17
        if: steps.config.outputs.build_type == 'flutter'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        if: steps.config.outputs.build_type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Extract & Build Flutter Project
        if: steps.config.outputs.build_type == 'flutter'
        run: |
          set -e
          BUILD_MODE=$(jq -r '.build_type // "release"' build-config.json)
          echo "🔨 Building Flutter APK (${BUILD_MODE})..."

          # Extract ZIP
          mkdir -p flutter_src
          unzip -q flutter-project.zip -d flutter_src

          # Find project root (handle nested folder in zip)
          PROJECT_DIR=$(find flutter_src -name "pubspec.yaml" -maxdepth 2 | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ pubspec.yaml not found in ZIP!"
            exit 1
          fi
          echo "📁 Project dir: ${PROJECT_DIR}"
          cd "$PROJECT_DIR"

          # Get dependencies
          flutter pub get

          # Build APK
          if [ "$BUILD_MODE" = "debug" ]; then
            flutter build apk --debug
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          else
            flutter build apk --release
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at ${APK_PATH}"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi

          # Copy APK to workspace root for artifact
          cp "$APK_PATH" "${GITHUB_WORKSPACE}/app-${BUILD_MODE}.apk"
          echo "✅ APK built successfully: app-${BUILD_MODE}.apk"

      # ============================================================
      # 2B. WEB2APK BUILD (WebView APK from URL)
      # ============================================================
      - name: Setup Java JDK 17 (Web2APK)
        if: steps.config.outputs.build_type == 'web2apk'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web2APK
        if: steps.config.outputs.build_type == 'web2apk'
        run: |
          set -e
          WEB_URL=$(jq -r '.url' build-config.json)
          APP_NAME=$(jq -r '.app_name // "WebApp"' build-config.json)
          PACKAGE_NAME="com.webapp.$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | head -c 20)"

          echo "🌐 Web2APK Build"
          echo "   URL: ${WEB_URL}"
          echo "   App: ${APP_NAME}"
          echo "   Pkg: ${PACKAGE_NAME}"

          # Create Android project structure
          mkdir -p web2apk/app/src/main/java/com/webapp
          mkdir -p web2apk/app/src/main/res/drawable
          mkdir -p web2apk/app/src/main/res/values
          mkdir -p web2apk/app/src/main/res/mipmap-hdpi

          # Copy icon
          if [ -f build-assets/icon.png ]; then
            cp build-assets/icon.png web2apk/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp build-assets/icon.png web2apk/app/src/main/res/drawable/icon.png
          fi

          # AndroidManifest.xml
          cat > web2apk/app/src/main/AndroidManifest.xml << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${PACKAGE_NAME}">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${APP_NAME}"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XMLEOF

          # MainActivity.java
          cat > web2apk/app/src/main/java/com/webapp/MainActivity.java << JAVAEOF
          package ${PACKAGE_NAME};
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("${WEB_URL}");
              }
          }
          JAVAEOF

          # styles.xml
          cat > web2apk/app/src/main/res/values/styles.xml << STYLEEOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#FF6200EE</item>
              </style>
          </resources>
          STYLEEOF

          # build.gradle (project)
          cat > web2apk/build.gradle << GRADLEEOF
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          GRADLEEOF

          # build.gradle (app)
          cat > web2apk/app/build.gradle << APPEOF
          plugins { id 'com.android.application' }
          android {
              namespace '${PACKAGE_NAME}'
              compileSdk 34
              defaultConfig {
                  applicationId "${PACKAGE_NAME}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          dependencies {}
          APPEOF

          # settings.gradle
          echo "include ':app'" > web2apk/settings.gradle

          # gradle.properties
          cat > web2apk/gradle.properties << PROPEOF
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          PROPEOF

          # Download Gradle wrapper
          cd web2apk
          GRADLE_VERSION=8.5
          mkdir -p gradle/wrapper
          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          export PATH="/opt/gradle-${GRADLE_VERSION}/bin:$PATH"

          # Accept licenses
          yes | sdkmanager --licenses 2>/dev/null || true

          # Build APK
          gradle assembleDebug --no-daemon --stacktrace

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ Web2APK build failed!"
            find . -name "*.apk" || true
            exit 1
          fi

          SAFE_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_' | head -c 30)
          cp "$APK_PATH" "${GITHUB_WORKSPACE}/${SAFE_NAME}-web2apk.apk"
          echo "✅ Web2APK built: ${SAFE_NAME}-web2apk.apk"

      # ============================================================
      # 3. UPLOAD ARTIFACT (WAJIB - Bot download ini)
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: "*.apk"
          retention-days: 1
          if-no-files-found: error
