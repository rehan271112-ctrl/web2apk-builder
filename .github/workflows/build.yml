name: Build APK

on:
  push:
    branches:
      - build

# Cancel previous runs on same branch to save time
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ============================================================
      # 1. CHECKOUT & CONFIG (Fast)
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: build

      - name: Read build config
        id: config
        run: |
          if [ ! -f build-config.json ]; then
            echo "❌ build-config.json not found!"
            exit 1
          fi
          echo "type=$(jq -r .type build-config.json)" >> $GITHUB_ENV
          echo "url=$(jq -r '.url // ""' build-config.json)" >> $GITHUB_ENV
          echo "app_name=$(jq -r '.app_name // "WebApp"' build-config.json)" >> $GITHUB_ENV
          echo "build_type=$(jq -r '.build_type // "release"' build-config.json)" >> $GITHUB_ENV
          cat build-config.json

      # ============================================================
      # 2. SHARED SETUP (Only what's needed)
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      # ============================================================
      # 3A. WEB2APK BUILD (Optimized)
      # ============================================================
      - name: Web2APK - Generate project files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/java/com/web2apk/app
          mkdir -p project/app/src/main/res/{layout,values,mipmap-hdpi,mipmap-mdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi}

          # --- Root Gradle Files ---
          cat > project/build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.7.3' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat > project/settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Web2APK"
          include ':app'
          EOF

          cat > project/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # --- App build.gradle ---
          cat > project/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.web2apk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword "android"
                      keyAlias "release"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.8.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # --- AndroidManifest.xml ---
          cat > project/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity android:name=".SplashActivity" android:exported="true" android:theme="@style/SplashTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="false"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode" />
              </application>
          </manifest>
          EOF

          # --- MainActivity.java ---
          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java << JAVAEOF
          package com.web2apk.app;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.*;
          import android.widget.ProgressBar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.Toolbar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends AppCompatActivity {
              private static final String WEBSITE_URL = "${{ env.url }}";
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefreshLayout = findViewById(R.id.swipeRefreshLayout);
                  Toolbar toolbar = findViewById(R.id.toolbar);
                  setSupportActionBar(toolbar);
                  if (getSupportActionBar() != null) getSupportActionBar().setTitle(getString(R.string.app_name));
                  setupWebView();
                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl(WEBSITE_URL);
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView v, String u) {
                          progressBar.setVisibility(View.GONE);
                          swipeRefreshLayout.setRefreshing(false);
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("tel:") || u.startsWith("mailto:") || u.startsWith("intent:") || u.startsWith("whatsapp:")) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView v, int p) {
                          progressBar.setProgress(p);
                          progressBar.setVisibility(p >= 100 ? View.GONE : View.VISIBLE);
                      }
                  });

                  webView.setDownloadListener((url, ua, cd, mime, len) -> {
                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, cd != null ? cd : "download");
                      ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(req);
                  });
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) { webView.goBack(); return; }
                  super.onBackPressed();
              }
              @Override protected void onResume() { if (webView != null) webView.onResume(); }
              @Override protected void onPause() { if (webView != null) webView.onPause(); super.onPause(); }
              @Override protected void onDestroy() { if (webView != null) webView.destroy(); super.onDestroy(); }
          }
          JAVAEOF

          # --- SplashActivity.java ---
          cat > project/app/src/main/java/com/web2apk/app/SplashActivity.java << 'EOF'
          package com.web2apk.app;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.appcompat.app.AppCompatActivity;
          public class SplashActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> {
                      startActivity(new Intent(SplashActivity.this, MainActivity.class));
                      finish();
                  }, 1500);
              }
          }
          EOF

          # --- Layouts & Resources ---
          cat > project/app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
              <androidx.appcompat.widget.Toolbar android:id="@+id/toolbar"
                  android:layout_width="match_parent" android:layout_height="56dp"
                  android:background="#000000" app:titleTextColor="#FFFFFF"/>
              <ProgressBar android:id="@+id/progressBar" style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent" android:layout_height="4dp" android:max="100"/>
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout android:id="@+id/swipeRefreshLayout"
                  android:layout_width="match_parent" android:layout_height="match_parent">
                  <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent"/>
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          </LinearLayout>
          EOF

          cat > project/app/src/main/res/layout/activity_splash.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000000">
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_centerInParent="true" android:gravity="center" android:orientation="vertical">
                  <ImageView android:id="@+id/splashLogo" android:layout_width="120dp" android:layout_height="120dp"
                      android:src="@mipmap/ic_launcher" />
                  <TextView android:id="@+id/splashAppName" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="@string/app_name" android:textSize="26sp" android:textStyle="bold"
                      android:textColor="#FFFFFF" android:layout_marginTop="20dp" />
                  <ProgressBar android:layout_width="40dp" android:layout_height="40dp" android:layout_marginTop="30dp" />
              </LinearLayout>
          </RelativeLayout>
          EOF

          cat > project/app/src/main/res/values/strings.xml << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${{ env.app_name }}</string>
          </resources>
          XMLEOF

          cat > project/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
              <style name="SplashTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          cat > project/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#2196F3</color>
          </resources>
          EOF

      - name: Web2APK - Process icons
        if: env.type == 'web2apk'
        run: |
          ICON="build-assets/icon.png"
          if [ ! -f "$ICON" ] || ! file "$ICON" | grep -qi png; then
            echo "⚠️ Icon invalid/missing, generating default..."
            # Use ffmpeg (pre-installed) instead of imagemagick
            ffmpeg -y -f lavfi -i "color=c=blue:s=512x512:d=1" -frames:v 1 "$ICON" 2>/dev/null
          fi
          for size_dir in "48 mdpi" "72 hdpi" "96 xhdpi" "144 xxhdpi" "192 xxxhdpi"; do
            size=$(echo $size_dir | cut -d' ' -f1)
            dir=$(echo $size_dir | cut -d' ' -f2)
            ffmpeg -y -i "$ICON" -vf "scale=${size}:${size}" \
              "project/app/src/main/res/mipmap-${dir}/ic_launcher.png" 2>/dev/null
            cp "project/app/src/main/res/mipmap-${dir}/ic_launcher.png" \
               "project/app/src/main/res/mipmap-${dir}/ic_launcher_round.png"
          done

      - name: Web2APK - Build & Sign APK
        if: env.type == 'web2apk'
        timeout-minutes: 15
        run: |
          cd project
          # Use pre-installed gradle or wrapper, no SDKMAN needed
          gradle assembleRelease --no-daemon --parallel --build-cache \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:+UseParallelGC"

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "❌ APK not found!"; exit 1; fi

          # Sign with jarsigner (more reliable in CI than apksigner path lookup)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore ../release.keystore -storepass android -keypass android \
            "$APK" release

          # Verify
          jarsigner -verify "$APK"
          echo "✅ Web2APK signed: $APK"

      # ============================================================
      # 3B. FLUTTER BUILD (Optimized)
      # ============================================================
      - name: Prepare Flutter project
        if: env.type == 'flutter'
        run: |
          rm -rf flutter-project
          mkdir -p flutter-project
          unzip -q flutter-project.zip -d flutter-project

          # Flatten nested folder
          FIRST_DIR=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -1)
          ROOT_COUNT=$(find flutter-project -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ROOT_COUNT" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            TMP=$(mktemp -d)
            cp -R "$FIRST_DIR"/. "$TMP"/
            rm -rf flutter-project
            mkdir -p flutter-project
            cp -R "$TMP"/. flutter-project/
          fi

          [ ! -f flutter-project/pubspec.yaml ] && echo "❌ pubspec.yaml not found" && exit 1
          echo "✅ Flutter project ready"

      - name: Detect Flutter version
        if: env.type == 'flutter'
        id: flutter_ver
        run: |
          PUBSPEC="flutter-project/pubspec.yaml"
          SDK_LINE=$(grep -A2 '^environment:' "$PUBSPEC" | grep 'sdk:' | head -1 | sed 's/.*sdk:[[:space:]]*//; s/["\x27]//g' || true)
          DART_VER=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -1)

          # Simplified mapping
          case "$DART_VER" in
            3.8*|3.9*|3.1[0-9]*) VER="3.35.2" ;;
            3.7*)                 VER="3.29.0" ;;
            3.6*)                 VER="3.27.0" ;;
            3.5*)                 VER="3.24.0" ;;
            3.4*)                 VER="3.22.0" ;;
            *)                    VER="3.27.0" ;;
          esac

          # Override for known high-version plugins
          for plugin in "webview_flutter.*[5-9]\." "geolocator.*1[4-9]\." "google_maps_flutter.*[3-9]\." "firebase_core.*[3-9]\."; do
            grep -Eq "$plugin" "$PUBSPEC" && VER="3.35.2" && break
          done

          echo "FLUTTER_VERSION=$VER" >> $GITHUB_ENV
          echo "Using Flutter $VER (Dart SDK constraint: $SDK_LINE)"

      - name: Setup Flutter SDK
        if: env.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter APK
        if: env.type == 'flutter'
        timeout-minutes: 25
        run: |
          set -e
          cd flutter-project
          flutter --version

          BUILD_MODE="${{ env.build_type }}"
          MAX_RETRIES=3
          RETRY=0
          SUCCESS=false

          while [ $RETRY -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY=$((RETRY + 1))
            echo "=== Attempt $RETRY/$MAX_RETRIES ==="

            if flutter pub get 2>&1 | tee /tmp/pub.log; then
              if [ "$BUILD_MODE" = "debug" ]; then
                flutter build apk --debug && SUCCESS=true
              else
                flutter build apk --release && SUCCESS=true
              fi
            fi

            if [ "$SUCCESS" = false ]; then
              echo "⚠️ Failed, attempting auto-fix..."
              # Quick SDK constraint fix
              sed -i -E 's/sdk:[[:space:]]*["\x27]?[\^>=]*3\.[0-9]+(\.[0-9]+)?["\x27]?/sdk: ">=3.6.0 <4.0.0"/g' pubspec.yaml || true
              # Remove problematic overrides
              sed -i '/^dependency_overrides:/,/^[^ ]/d' pubspec.yaml || true
              rm -f pubspec.lock
              rm -rf build .dart_tool
            fi
          done

          [ "$SUCCESS" = false ] && echo "❌ Build failed after $MAX_RETRIES attempts" && cat /tmp/pub.log && exit 1
          echo "✅ Flutter build successful!"

      - name: Sign Flutter APK (release only)
        if: env.type == 'flutter' && env.build_type == 'release'
        run: |
          APK=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "⚠️ No release APK found, skip signing"; exit 0; fi
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore -storepass android -keypass android \
            "$APK" release
          jarsigner -verify "$APK"
          echo "✅ Flutter APK signed: $APK"

      # ============================================================
      # 4. UPLOAD ARTIFACT (Must match bot expectation)
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            project/app/build/outputs/apk/release/*.apk
            flutter-project/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
          if-no-files-found: error
